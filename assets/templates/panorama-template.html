<!DOCTYPE html>
<!-- 功能全景图骨架：分区(Architecture)布局。复制本文件后替换所有 <TODO>。
     画法规则见 explain-hub/references/diagram-spec.md；
     权威规则：third-party/diagram-design/SKILL.md §6/§7 + references/type-architecture.md -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title><项目名> · 功能全景图</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#f5f5f5;font-family:'Geist','Noto Sans SC',sans-serif;color:#2d3142;}
  main{max-width:1220px;margin:0 auto;padding:40px 28px 48px;}
  .eyebrow{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7a8399;margin:0 0 10px;}
  h1{font-family:'Instrument Serif','Noto Sans SC',serif;font-weight:400;font-size:30px;margin:0 0 6px;}
  .subtitle{font-size:14px;color:#4f5d75;margin:0 0 28px;}
  figure{margin:0;}
  figcaption{font-family:'Geist Mono',monospace;font-size:10px;color:#7a8399;margin-top:14px;}
  footer{margin-top:36px;padding-top:12px;border-top:1px solid rgba(45,49,66,.10);font-family:'Geist Mono',monospace;font-size:10px;color:#7a8399;letter-spacing:.06em;}
</style>
</head>
<body>
<main>
<header>
  <p class="eyebrow"><项目名> · Feature Panorama</p>
  <h1>功能全景图</h1>
  <p class="subtitle"><一句话概括分区结构，如：三大功能域 · 九个模块></p>
</header>
<figure>
<svg viewBox="0 0 1180 690" role="img" aria-labelledby="pp-title pp-desc">
<title id="pp-title"><项目名> 功能全景图</title>
<desc id="pp-desc"><一句话向无图读者描述内容，描述信息而非几何。></desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- 分区：最多 3 个。先画分区，再画箭头，最后画节点。
     zone: x/y/w/h 四边留 28px 内边距；标签蒙版压在分区顶线上 -->
<rect x="40" y="130" width="320" height="476" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<rect x="<label-x>" y="134" width="150" height="12" rx="2" fill="#f5f5f5"/>
<text x="<label-cx>" y="143" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.14em">ZONE A <中文名></text>
<!-- <TODO: 再复制 1-2 个分区；三列布局常用 x=40/420/800, w=320/320/340> -->

<!-- 箭头：先画。直线仅限同 x/y；异端点用 r=8 肘线；虚线跨实线加 a 8,8 半圆桥 -->
<line x1="332" y1="234" x2="448" y2="234" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- 标签 = 蒙版 rect(纸色) + 文字，距线 6-10px，绝不压线 -->
<rect x="366" y="214" width="48" height="12" rx="2" fill="#f5f5f5"/>
<text x="390" y="223" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.06em">FLOW</text>
<!-- <TODO: 其余箭头；总数 ≤12；虚线 stroke-width=1 + stroke-dasharray="4,3"> -->

<!-- 节点：盒子 = 纸色蒙版 rect + 样式 rect 叠放；行高 120，常用行 y=174/320/466 -->
<rect x="68" y="174" width="264" height="120" rx="6" fill="#f5f5f5"/>
<rect x="68" y="174" width="264" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<!-- 类型小标签 -->
<rect x="76" y="180" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
<text x="90" y="189" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">TAG</text>
<!-- 名称（中文用 sans）+ 两条副标签（技术信息用 mono） -->
<text x="200" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle"><模块名></text>
<text x="200" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle"><要点一 · 要点二></text>
<text x="200" y="262" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle"><file:line 或关键词></text>
<!-- 焦点节点（每图 ≤2）：fill 换 rgba(235,108,54,0.10)，stroke 换 #eb6c36 -->
<!-- <TODO: 其余节点，总量 ≤9> -->

<!-- 图例：底部横排，先发丝线 -->
<line x1="30" y1="634" x2="1150" y2="634" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="30" y="658" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
<!-- <TODO: 图例项 = 小色块/线样 + 中文名，与本图实际用到的类型一一对应，不画没用的> -->
</svg>
<figcaption>基于源码标注：<owner>/<repo> <版本> · <本机副本或 commit></figcaption>
</figure>
<footer><PROJECT> FEATURE PANORAMA · GENERATED WITH DIAGRAM-DESIGN · <日期></footer>
</main>
</body>
</html>
