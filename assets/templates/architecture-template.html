<!DOCTYPE html>
<!-- 模块架构图骨架：与全景图同为 Architecture 布局，差异在分区语义（按进程/层/信任边界划分）
     与箭头语义（标通信方式：HTTP / IPC / require / spawn）。规则见 references/diagram-spec.md -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title><项目名> · 模块架构图</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#f5f5f5;font-family:'Geist','Noto Sans SC',sans-serif;color:#2d3142;}
  main{max-width:1220px;margin:0 auto;padding:40px 28px 48px;}
  .eyebrow{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7a8399;margin:0 0 10px;}
  h1{font-family:'Instrument Serif','Noto Sans SC',serif;font-weight:400;font-size:30px;margin:0 0 6px;}
  .subtitle{font-size:14px;color:#4f5d75;margin:0 0 28px;}
  figure{margin:0;}
  figcaption{font-family:'Geist Mono',monospace;font-size:10px;color:#7a8399;margin-top:14px;}
  footer{margin-top:36px;padding-top:12px;border-top:1px solid rgba(45,49,66,.10);font-family:'Geist Mono',monospace;font-size:10px;color:#7a8399;letter-spacing:.06em;}
</style>
</head>
<body>
<main>
<header>
  <p class="eyebrow"><项目名> · Module Architecture</p>
  <h1>模块架构图</h1>
  <p class="subtitle"><一句话：哪几层、靠什么通道通信></p>
</header>
<figure>
<svg viewBox="0 0 1180 690" role="img" aria-labelledby="ma-title ma-desc">
<title id="ma-title"><项目名> 模块架构图</title>
<desc id="ma-desc"><一句话：按什么分层、各层职责、靠什么通道连接。></desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- 分区语义 = 进程/层/信任边界。例：RENDERER 渲染层 · CHROMIUM / MAIN 主进程 / SERVER 服务端 :端口 -->
<rect x="40" y="130" width="320" height="476" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<rect x="<label-x>" y="134" width="200" height="12" rx="2" fill="#f5f5f5"/>
<text x="<label-cx>" y="143" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.14em">LAYER <中文名> · <运行时></text>

<!-- 箭头语义：实线=主数据通道（标 HTTP/IPC/require 等真实机制），
     虚线=辅助通道；跨实线的虚线必须 a 8,8 半圆桥：
     竖直方向上行的桥写法：V <cross+8> a 8,8 0 0 1 0,-16 V <cross-8> -->
<path d="M <x1>,<y1> H <mid-8> Q <mid>,<y1> <mid>,<y1+8> V <y2-8> Q <mid>,<y2> <mid+8>,<y2> H <x2>" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="<lx>" y="<ly>" width="60" height="12" rx="2" fill="#f5f5f5"/>
<text x="<lcx>" y="<ly+9>" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.06em">HTTP</text>

<!-- 节点同全景图盒子；此处节点名 = 真实文件/目录名，副标签 = 职责 + file:line -->
<rect x="68" y="174" width="264" height="120" rx="6" fill="#f5f5f5"/>
<rect x="68" y="174" width="264" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="76" y="180" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
<text x="98" y="189" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">COMP</text>
<text x="200" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle"><组件名（真实文件名）></text>
<text x="200" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle"><职责一行></text>
<text x="200" y="262" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle"><path/file.ts:行号></text>
<!-- 焦点 = 本架构的集成枢纽（通常是被最多箭头指向的那一层） -->

<!-- 图例建议项：焦点枢纽 / 进程内模块 / 实线=主数据通道 / 虚线=辅助通道 -->
<line x1="30" y1="634" x2="1150" y2="634" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="30" y="658" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
<!-- <TODO> -->
</svg>
<figcaption>通信契约：<用一句话写死两条通道的真实机制，如 渲染层 fetch 同源 /api/*，主进程经 contextBridge 暴露></figcaption>
</figure>
<footer><PROJECT> MODULE ARCHITECTURE · GENERATED WITH DIAGRAM-DESIGN · <日期></footer>
</main>
</body>
</html>
