<!doctype html>
<!-- Module architecture skeleton: same Architecture layout as the panorama;
     the differences are zone semantics (partition by process/layer/trust
     boundary) and arrow semantics (label the transport: HTTP / IPC / require
     / spawn). Rules: explain-hub/references/diagram-spec.md.
     Localize all user-facing text to the user's language. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{project}} · Module Architecture</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: #f5f5f5;
        font-family: "Geist", "Noto Sans SC", sans-serif;
        color: #2d3142;
      }
      main {
        max-width: 1220px;
        margin: 0 auto;
        padding: 40px 28px 48px;
      }
      .eyebrow {
        font-family: "Geist Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #7a8399;
        margin: 0 0 10px;
      }
      h1 {
        font-family: "Instrument Serif", "Noto Sans SC", serif;
        font-weight: 400;
        font-size: 30px;
        margin: 0 0 6px;
      }
      .subtitle {
        font-size: 14px;
        color: #4f5d75;
        margin: 0 0 28px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        font-family: "Geist Mono", monospace;
        font-size: 10px;
        color: #7a8399;
        margin-top: 14px;
      }
      footer {
        margin-top: 36px;
        padding-top: 12px;
        border-top: 1px solid rgba(45, 49, 66, 0.1);
        font-family: "Geist Mono", monospace;
        font-size: 10px;
        color: #7a8399;
        letter-spacing: 0.06em;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">{{project}} · Module Architecture</p>
        <h1>Module architecture</h1>
        <p class="subtitle">
          {{One line: which layers, talking over which channels}}
        </p>
      </header>
      <figure>
        <svg
          viewBox="0 0 1180 690"
          role="img"
          aria-labelledby="ma-title ma-desc"
        >
          <title id="ma-title">{{project}} module architecture</title>
          <desc id="ma-desc">
            {{One sentence: how it is layered, each layer's responsibility,
            which channels connect them.}}
          </desc>
          <defs>
            <marker
              id="arrow"
              markerWidth="8"
              markerHeight="6"
              refX="7"
              refY="3"
              orient="auto"
            >
              <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
            </marker>
            <marker
              id="arrow-accent"
              markerWidth="8"
              markerHeight="6"
              refX="7"
              refY="3"
              orient="auto"
            >
              <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
            </marker>
          </defs>
          <rect width="100%" height="100%" fill="#f5f5f5" />

          <!-- Zone semantics = process/layer/trust boundary. Example: RENDERER ·
     CHROMIUM / MAIN main process / SERVER :port -->
          <rect
            x="40"
            y="130"
            width="320"
            height="476"
            rx="8"
            fill="rgba(45,49,66,0.02)"
            stroke="rgba(45,49,66,0.10)"
            stroke-width="0.8"
          />
          <rect x="100" y="134" width="200" height="12" rx="2" fill="#f5f5f5" />
          <text
            x="200"
            y="143"
            fill="rgba(45,49,66,0.40)"
            font-size="7"
            font-family="'Geist Mono','Noto Sans SC',monospace"
            text-anchor="middle"
            letter-spacing="0.14em"
          >
            LAYER {{name}} · {{runtime}}
          </text>

          <!-- Arrow semantics: solid = main data channel (label the real mechanism:
     HTTP/IPC/require), dashed = auxiliary channel; a dashed line crossing a
     solid one must carry an a 8,8 half-circle bridge. Upward vertical bridge:
     V {{cross+8}} a 8,8 0 0 1 0,-16 V {{cross-8}} -->
          <path
            d="M 360,234 H 542 Q 550,234 550,242 V 486 Q 550,494 558,494 H 740"
            fill="none"
            stroke="#4f5d75"
            stroke-width="1.2"
            marker-end="url(#arrow)"
          />
          <rect x="416" y="216" width="56" height="12" rx="2" fill="#f5f5f5" />
          <text
            x="444"
            y="225"
            fill="#7a8399"
            font-size="8"
            font-family="'Geist Mono','Noto Sans SC',monospace"
            text-anchor="middle"
            letter-spacing="0.06em"
          >
            IPC
          </text>

          <!-- Node boxes as in the panorama; here the node name = the real file/dir
     name, sublabels = responsibility + file:line -->
          <rect x="68" y="174" width="264" height="120" rx="6" fill="#f5f5f5" />
          <rect
            x="68"
            y="174"
            width="264"
            height="120"
            rx="6"
            fill="#ffffff"
            stroke="#2d3142"
            stroke-width="1"
          />
          <rect
            x="76"
            y="180"
            width="44"
            height="12"
            rx="2"
            fill="transparent"
            stroke="rgba(45,49,66,0.40)"
            stroke-width="0.8"
          />
          <text
            x="98"
            y="189"
            fill="rgba(45,49,66,0.8)"
            font-size="7"
            font-family="'Geist Mono',monospace"
            text-anchor="middle"
            letter-spacing="0.08em"
          >
            COMP
          </text>
          <text
            x="200"
            y="222"
            fill="#2d3142"
            font-size="12"
            font-weight="600"
            font-family="'Geist','Noto Sans SC',sans-serif"
            text-anchor="middle"
          >
            {{component (real file name)}}
          </text>
          <text
            x="200"
            y="246"
            fill="#4f5d75"
            font-size="9"
            font-family="'Geist Mono','Noto Sans SC',monospace"
            text-anchor="middle"
          >
            {{one-line responsibility}}
          </text>
          <text
            x="200"
            y="262"
            fill="#4f5d75"
            font-size="9"
            font-family="'Geist Mono','Noto Sans SC',monospace"
            text-anchor="middle"
          >
            {{path/file.ts:line}}
          </text>
          <!-- Focus = the integration hub of this architecture (usually the layer
     with the most arrows pointing at it) -->

          <!-- Suggested legend items: focus hub / in-process module / solid = main
     data channel / dashed = auxiliary channel -->
          <line
            x1="30"
            y1="634"
            x2="1150"
            y2="634"
            stroke="rgba(45,49,66,0.10)"
            stroke-width="0.8"
          />
          <text
            x="30"
            y="658"
            fill="#4f5d75"
            font-size="8"
            font-family="'Geist Mono',monospace"
            letter-spacing="0.14em"
          >
            LEGEND
          </text>
          <!-- {{TODO: legend items}} -->
        </svg>
        <figcaption>
          Transport contract: {{one sentence fixing the real mechanisms, e.g.
          renderer fetches same-origin /api/*, main process exposes via
          contextBridge}}
        </figcaption>
      </figure>
      <footer>
        {{PROJECT}} MODULE ARCHITECTURE · GENERATED WITH DIAGRAM-DESIGN ·
        {{date}}
      </footer>
    </main>
  </body>
</html>
