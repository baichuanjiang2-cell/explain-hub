<!doctype html>
<!-- Runtime flow skeleton: vertical Flowchart main path. Shape carries
     semantics (oval start / rect step / diamond decision ≤3 exits, each exit
     labeled / small solid dot to merge). Rules:
     explain-hub/references/diagram-spec.md.
     Localize all user-facing text to the user's language. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{project}} · Runtime Flow</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: #f5f5f5;
        font-family: "Geist", "Noto Sans SC", sans-serif;
        color: #2d3142;
      }
      main {
        max-width: 1220px;
        margin: 0 auto;
        padding: 40px 28px 48px;
      }
      .eyebrow {
        font-family: "Geist Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #7a8399;
        margin: 0 0 10px;
      }
      h1 {
        font-family: "Instrument Serif", "Noto Sans SC", serif;
        font-weight: 400;
        font-size: 30px;
        margin: 0 0 6px;
      }
      .subtitle {
        font-size: 14px;
        color: #4f5d75;
        margin: 0 0 28px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        font-family: "Geist Mono", monospace;
        font-size: 10px;
        color: #7a8399;
        margin-top: 14px;
      }
      footer {
        margin-top: 36px;
        padding-top: 12px;
        border-top: 1px solid rgba(45, 49, 66, 0.1);
        font-family: "Geist Mono", monospace;
        font-size: 10px;
        color: #7a8399;
        letter-spacing: 0.06em;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">{{project}} · Runtime Flow</p>
        <h1>Runtime flow</h1>
        <p class="subtitle">{{One line: the core path from what to what}}</p>
      </header>
      <figure>
        <svg
          viewBox="0 0 1180 1090"
          role="img"
          aria-labelledby="mf-title mf-desc"
        >
          <title id="mf-title">{{project}} runtime flow</title>
          <desc id="mf-desc">
            {{One sentence: where the main path starts, the key steps it passes,
            where it branches and merges, where it ends.}}
          </desc>
          <defs>
            <marker
              id="arrow"
              markerWidth="8"
              markerHeight="6"
              refX="7"
              refY="3"
              orient="auto"
            >
              <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
            </marker>
            <marker
              id="arrow-accent"
              markerWidth="8"
              markerHeight="6"
              refX="7"
              refY="3"
              orient="auto"
            >
              <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
            </marker>
          </defs>
          <rect width="100%" height="100%" fill="#f5f5f5" />

          <!-- Main path centered at cx=480 (box x=280 w=400); branches go right.
     Draw all arrows first, then nodes -->
          <!-- 1 start: pill -->
          <rect
            x="330"
            y="141"
            width="300"
            height="68"
            rx="34"
            fill="#f5f5f5"
          />
          <rect
            x="330"
            y="141"
            width="300"
            height="68"
            rx="34"
            fill="rgba(45,49,66,0.05)"
            stroke="#7a8399"
            stroke-width="1"
          />
          <text
            x="480"
            y="172"
            fill="#2d3142"
            font-size="12"
            font-weight="600"
            font-family="'Geist','Noto Sans SC',sans-serif"
            text-anchor="middle"
          >
            {{start action}}
          </text>
          <text
            x="480"
            y="192"
            fill="#4f5d75"
            font-size="9"
            font-family="'Geist Mono','Noto Sans SC',monospace"
            text-anchor="middle"
          >
            {{entry example (UI/command/event)}}
          </text>
          <line
            x1="480"
            y1="209"
            x2="480"
            y2="241"
            stroke="#4f5d75"
            stroke-width="1.2"
            marker-end="url(#arrow)"
          />

          <!-- 2 step rect: name + 2 detail lines + file:line -->
          <rect x="280" y="241" width="400" height="92" rx="6" fill="#f5f5f5" />
          <rect
            x="280"
            y="241"
            width="400"
            height="92"
            rx="6"
            fill="#ffffff"
            stroke="#2d3142"
            stroke-width="1"
          />
          <text
            x="480"
            y="272"
            fill="#2d3142"
            font-size="12"
            font-weight="600"
            font-family="'Geist','Noto Sans SC',sans-serif"
            text-anchor="middle"
          >
            {{step name (real function)}}
          </text>
          <text
            x="480"
            y="294"
            fill="#4f5d75"
            font-size="9"
            font-family="'Geist Mono','Noto Sans SC',monospace"
            text-anchor="middle"
          >
            {{key action · concurrency/cache details}}
          </text>
          <text
            x="480"
            y="310"
            fill="#4f5d75"
            font-size="9"
            font-family="'Geist Mono','Noto Sans SC',monospace"
            text-anchor="middle"
          >
            {{file:line}}
          </text>

          <!-- Decision diamond (≤3 exits; Yes right / No down; every exit must carry
     a label):
<polygon points="480,500 620,555 480,610 340,555" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
     Branch rects go on the right (e.g. x=740 w=290); merge with an r=4
     solid dot; a dashed loop back = retry/iteration -->

          <!-- Coral: only the one node that enters the main loop / the most critical
     decision, plus its incoming edge -->

          <!-- Suggested legend items: focus step / processing step / decision /
     merge point -->
          <line
            x1="30"
            y1="1044"
            x2="1150"
            y2="1044"
            stroke="rgba(45,49,66,0.10)"
            stroke-width="0.8"
          />
          <text
            x="30"
            y="1068"
            fill="#4f5d75"
            font-size="8"
            font-family="'Geist Mono',monospace"
            letter-spacing="0.14em"
          >
            LEGEND
          </text>
          <!-- {{TODO: legend items}} -->
        </svg>
        <figcaption>
          {{One line on branch choices: which paths were merged, relative
          positions of anchor files}}
        </figcaption>
      </figure>
      <footer>
        {{PROJECT}} RUNTIME FLOW · GENERATED WITH DIAGRAM-DESIGN · {{date}}
      </footer>
    </main>
  </body>
</html>
